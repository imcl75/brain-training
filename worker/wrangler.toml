name = "brain-gym-sync"
main = "worker.js"
compatibility_date = "2026-10-01"

# Create the namespace with:  npx wrangler kv namespace create BRAIN
# then paste the id it prints here.
[[kv_namespaces]]
binding = "BRAIN"
id = "REPLACE_WITH_KV_NAMESPACE_ID"

[vars]
ALLOWED_ORIGINS = "https://imcl75.github.io"
